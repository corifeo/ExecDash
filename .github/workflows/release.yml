name: Release

# When main carries a package.json version that has no tag yet, tag the
# commit that last changed package.json (the release commit) vX.Y.Z and
# publish a GitHub release from its CHANGELOG section.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check for an existing tag
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.v.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} is already tagged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish the release
        if: steps.tag.outputs.exists == 'false'
        env:
          # The built-in token cannot create a tag on a commit that changes
          # workflow files, so a RELEASE_TOKEN secret (Contents and Workflows
          # write) is used when set.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node scripts/build.mjs --check
          node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          TARGET=$(git log -1 --format=%H -- package.json)
          gh release create "v$VERSION" --target "$TARGET" --title "ExecDash $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
